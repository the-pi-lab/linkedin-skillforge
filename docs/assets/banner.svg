<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090E" />
      <stop offset="50%" stop-color="#0E131F" />
      <stop offset="100%" stop-color="#06070A" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0EA5E9" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.3" />
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-grad)" />
  <rect width="1200" height="320" rx="16" fill="url(#grid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="220" cy="110" r="160" fill="#0EA5E9" fill-opacity="0.12" filter="url(#glow)" />
  <circle cx="980" cy="200" r="180" fill="#6366F1" fill-opacity="0.12" filter="url(#glow)" />
  <circle cx="600" cy="160" r="130" fill="#EC4899" fill-opacity="0.06" filter="url(#glow)" />

  <!-- Border Outline -->
  <rect x="1" y="1" width="1198" height="318" rx="15" fill="none" stroke="#1E293B" stroke-width="1.5" stroke-opacity="0.8" />

  <!-- Top Pill / Badge -->
  <g transform="translate(450, 42)">
    <rect width="300" height="30" rx="15" fill="url(#badge-grad)" stroke="#334155" stroke-width="1" />
    <circle cx="16" cy="15" r="4" fill="#10B981" />
    <circle cx="16" cy="15" r="7" fill="#10B981" fill-opacity="0.3" />
    <text x="32" y="19" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5">THE PI LAB &nbsp;•&nbsp; OPEN SOURCE AGENT LAYER</text>
  </g>

  <!-- Brand Title -->
  <text x="600" y="142" text-anchor="middle" fill="url(#text-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="900" letter-spacing="8">PI SKILLFORGE</text>

  <!-- Glowing Accent Line -->
  <rect x="420" y="162" width="360" height="2.5" rx="1.25" fill="url(#primary-glow)" filter="url(#subtle-glow)" />

  <!-- Subtitle -->
  <text x="600" y="202" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" letter-spacing="1">The Modular Intelligence &amp; Governed Reasoning Layer for LinkedIn Agents</text>

  <!-- Feature Pills Footer -->
  <g transform="translate(230, 240)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="160" height="36" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
    <text x="80" y="22" text-anchor="middle" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">⚡ 40 Production Skills</text>

    <!-- Pill 2 -->
    <rect x="180" y="0" width="165" height="36" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
    <text x="262" y="22" text-anchor="middle" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">💻 10+ IDE Environments</text>

    <!-- Pill 3 -->
    <rect x="365" y="0" width="185" height="36" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
    <text x="457" y="22" text-anchor="middle" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">🧬 Governed Self-Evolution</text>

    <!-- Pill 4 -->
    <rect x="570" y="0" width="170" height="36" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
    <text x="655" y="22" text-anchor="middle" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600">🛡️ Zero Dependency Stdlib</text>
  </g>
</svg>
